<h3>Nuevo Cliente</h3>

<form (ngSubmit)="anadirCliente(this.cliente_nuevo)">

  <div class="mb-3">
    <label class="form-label">Tipo Contenedor</label>
    <input type="text" class="form-control" [(ngModel)]="this.cliente_nuevo.tipo_contenedor" name="tipo_contenedor" required>
  </div>

  <div class="mb-3">
    <label class="form-label">PointID</label>
    <input type="text" class="form-control" [(ngModel)]="this.cliente_nuevo.PointID" name="PointID" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Nombre</label>
    <input type="text" class="form-control" [(ngModel)]="this.cliente_nuevo.nombre_cliente" name="nombre_cliente" required>
  </div>

  <div class="mb-3">
    <label class="form-label">CIF</label>
    <input type="text" class="form-control" [(ngModel)]="this.cliente_nuevo.cif_cliente" name="cif_cliente" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Teléfono</label>
    <input type="text" class="form-control" [(ngModel)]="this.cliente_nuevo.telefono_cliente" name="telefono_cliente" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Tipo Legal</label>
    <textarea class="form-control" [(ngModel)]="this.cliente_nuevo.tipo_legal" name="tipo_legal" rows="3"></textarea>
  </div>

  <div class="mb-3">
    <label class="form-label">Direccion</label>
    <input type="text" class="form-control" [(ngModel)]="this.cliente_nuevo.direccion" name="direccion" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Codigo Postal</label>
    <input type="text" class="form-control" [(ngModel)]="this.cliente_nuevo.cod_postal" name="cod_postal" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Localidad</label>
    <input type="text" class="form-control" [(ngModel)]="this.cliente_nuevo.localidad" name="localidad" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Provincia</label>
    <input type="text" class="form-control" [(ngModel)]="this.cliente_nuevo.provincia" name="provincia" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Pais</label>
    <input type="text" class="form-control" [(ngModel)]="this.cliente_nuevo.pais" name="pais" required>
  </div>

  <button type="submit" class="btn btn-primary">Guardar Cliente</button>

</form>
