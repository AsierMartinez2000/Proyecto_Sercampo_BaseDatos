
<div class="main-container">
  <h1>Bienvenidos a SercampoNET</h1>
  <div class="login-container">
    <div class="formulario mt-5">
         <form (ngSubmit)="iniciarSesion(this.datos_login)">
            <!-- NOMBRE -->
             <div class="col input-group input-group-sm mb-3">
               <span class="input-group-text">Nombre:</span>
             <input
               type="text"
               class="form-control"
               [(ngModel)]="datos_login.nombre"
               name="nombre"
               required
             />
           </div>
          
           <!--PASSWORD -->
             <div class="col input-group input-group-sm mb-3">
               <span class="input-group-text">Contraseña:</span>
               <input
                 type="password"
                 class="form-control"
                 [(ngModel)]="datos_login.password"
                 name="password"
               />
             </div>
             <button type="submit" class="btn btn-sercampo">Iniciar Sesión</button>
         </form>
    </div>

  </div>

</div>
