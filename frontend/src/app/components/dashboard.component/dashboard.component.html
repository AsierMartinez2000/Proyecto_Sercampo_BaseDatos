    <div class="dashboard">
        
        <div class="buscador">
            <input type="text" [(ngModel)]="cliente.dato" (keyup)="cargarClientesGeneral()" placeholder="Cliente"/>
            <button (click)="cargarClientesGeneral()">Buscar</button>
        </div>
        
        <div class="tabla">
            
            <table>
                <thead>
                    <tr>
                        <th>Id cliente</th>
                        <th>PointID</th>
                        <th>Nombre</th>
                        <th>CIF</th>
                        <th>Teléfono</th>
                        <th>Notas</th>
                    </tr>
                </thead>
                <tbody>
                    @for (cliente of clientes; track cliente.id_cliente){
                        <tr>
                            <td>{{cliente.id_cliente}}</td>
                            <td>{{cliente.PointID}}</td>
                            <td>{{cliente.nombre}}</td>
                            <td>{{cliente.cif}}</td>
                            <td>{{cliente.telefono}}</td>
                            <td>{{cliente.nota}}</td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
