<h3>Clientes Sercampo</h3>
    
    <div class="dashboard container">
        
        <div class="buscador">
            <input class="form-control form-control" type="text" [(ngModel)]="cliente.nombre" (keyup)="cargarClientesPorNombre()" placeholder="Nombre Cliente"/>
            <button class="btn btn-primary" (click)="cargarClientesPorNombre()">Buscar</button>
        </div>
        
        <div class="tabla">
            
            <table class="table">
                <thead>
                    <tr>
                        <th class="table-primary" >Id cliente</th>
                        <th class="table-primary">PointID</th>
                        <th class="table-primary">Nombre</th>
                        <th class="table-primary">CIF</th>
                        <th class="table-primary">Teléfono</th>
                        <th class="table-primary">Notas</th>
                    </tr>
                </thead>
                <tbody>
                    @for (cliente of clientes; track cliente.id_cliente){
                        <tr class="table-ligth">
                            <td >{{cliente.id_cliente}}</td>
                            <td>{{cliente.PointID}}</td>
                            <td>{{cliente.nombre}}</td>
                            <td>{{cliente.cif}}</td>
                            <td>{{cliente.telefono}}</td>
                            <td>{{cliente.nota}}</td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
